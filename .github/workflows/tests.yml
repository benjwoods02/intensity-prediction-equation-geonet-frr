name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite runs entirely offline. API responses are stubbed and the
      # geospatial and model checks use synthetic data, so a GeoNet outage or
      # a rate limit cannot turn the build red for reasons unrelated to the
      # code.
      - name: Run tests
        run: pytest tests/ -v

      - name: Fail on deprecation warnings
        run: pytest tests/ -q -W error::DeprecationWarning
